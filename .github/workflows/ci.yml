name: Baseline CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Nightly full run, including the tests tagged @slow that pull requests and merges skip.
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  # A pull request shares one group, so a newer push cancels its superseded run. Every other run (main, nightly,
  # manual) gets a group of its own: with a shared group, GitHub also cancels a run that is still *pending* behind
  # the running one, so back-to-back merges to main left commits without a result of their own.
  group: baseline-ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  baseline-ci:
    name: baseline-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the proposed changes
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # A pull request needs the merge commit and its parents to classify the change.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - name: Set up the verified Node version
        uses: actions/setup-node@v7
        with:
          node-version: '26.10.0'
          cache: npm
      # Documentation-only pull requests skip the install, build and test steps below. The job and its name still
      # report, so required checks pass. The decision comes from the same changed-path mapping as `npm run checks`
      # (tools/cli/checks.mjs): every changed path must be documentation no code reads; an unmapped path means the
      # full suite. Pushes to main, nightly and manual runs always run everything.
      - name: Classify the change (documentation only?)
        id: scope
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            # The checkout is the PR's merge commit: its first parent is the base, so the diff is the PR's own changes.
            node tools/cli/main.mjs checks --docs-only --since HEAD^1 | tee -a "$GITHUB_OUTPUT"
          else
            echo 'docs-only=false' | tee -a "$GITHUB_OUTPUT"
          fi
      - name: Install locked dependencies
        if: steps.scope.outputs.docs-only != 'true'
        run: npm ci
      - name: Check syntax and course metadata
        if: steps.scope.outputs.docs-only != 'true'
        run: npm run check
      - name: Build and verify legacy script preservation
        if: steps.scope.outputs.docs-only != 'true'
        run: npm run build
      - name: Check shared contracts
        if: steps.scope.outputs.docs-only != 'true'
        run: npm run test:contracts
      - name: Check simulation parity
        if: steps.scope.outputs.docs-only != 'true'
        run: npm run test:simulation
      - name: Check room lifecycle with fake clocks
        if: steps.scope.outputs.docs-only != 'true'
        run: npm run test:session
      - name: Check room transports and protocol boundaries
        if: steps.scope.outputs.docs-only != 'true'
        run: npm run test:network
      - name: Check local Worker recovery, abuse boundaries and traffic measurements
        if: steps.scope.outputs.docs-only != 'true'
        run: npm run test:rooms:local
      - name: Check procedural audio and resource ownership
        if: steps.scope.outputs.docs-only != 'true'
        run: npm run test:audio
      - name: Check renderer and camera parity with the legacy scene
        if: steps.scope.outputs.docs-only != 'true'
        run: npm run test:render
      - name: Check desktop input parity with the legacy handlers
        if: steps.scope.outputs.docs-only != 'true'
        run: npm run test:input
      - name: Check React screens, UI store and cleanup
        if: steps.scope.outputs.docs-only != 'true'
        run: npm run test:ui
      - name: Check the composed app flows, four clients and cleanup
        if: steps.scope.outputs.docs-only != 'true'
        run: npm run test:app
      - name: Check course catalog and stale metadata
        if: steps.scope.outputs.docs-only != 'true'
        run: npm run test:courses
      - name: Check CLI list, validate and shot commands
        if: steps.scope.outputs.docs-only != 'true'
        run: npm run test:cli
      - name: Check physics and mechanics
        if: steps.scope.outputs.docs-only != 'true'
        run: npm run test:physics
      - name: Check ported legacy smoke assertions
        if: steps.scope.outputs.docs-only != 'true'
        run: npm run test:integration
      - name: Check overnight backup, preflight and session limits
        if: steps.scope.outputs.docs-only != 'true'
        run: npm run test:overnight
      - name: Check bounded Gemini handoffs (fake Gemini, nothing sent)
        if: steps.scope.outputs.docs-only != 'true'
        run: npm run test:gemini

  browser-ci:
    name: browser-ci (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Check out the proposed changes
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # A pull request needs the merge commit and its parents to classify the change.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - name: Set up the verified Node version
        uses: actions/setup-node@v7
        with:
          node-version: '26.10.0'
          cache: npm
      # Documentation-only pull requests skip the install, build and test steps below. The job and its name still
      # report, so required checks pass. The decision comes from the same changed-path mapping as `npm run checks`
      # (tools/cli/checks.mjs): every changed path must be documentation no code reads; an unmapped path means the
      # full suite. Pushes to main, nightly and manual runs always run everything.
      - name: Classify the change (documentation only?)
        id: scope
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            # The checkout is the PR's merge commit: its first parent is the base, so the diff is the PR's own changes.
            node tools/cli/main.mjs checks --docs-only --since HEAD^1 | tee -a "$GITHUB_OUTPUT"
          else
            echo 'docs-only=false' | tee -a "$GITHUB_OUTPUT"
          fi
      - name: Install locked dependencies
        if: steps.scope.outputs.docs-only != 'true'
        run: npm ci
      # Browser binaries are cached per browser and lockfile; `install --with-deps` below then only fetches system libraries.
      - name: Cache the Playwright browser
        if: steps.scope.outputs.docs-only != 'true'
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - name: Install the Playwright browser and its system libraries
        if: steps.scope.outputs.docs-only != 'true'
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps ${{ matrix.browser }}
          else
            npx playwright install --with-deps ${{ matrix.browser }}
          fi
      # GPU-less runners: headless Firefox gets no WebGL and Chromium's SwiftShader is too slow for the
      # real-time putt timers, so both run headed on a virtual display with Mesa's software GL.
      - name: Install a virtual display and software OpenGL
        if: matrix.browser != 'webkit' && steps.scope.outputs.docs-only != 'true'
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1 || ! dpkg -s libgl1-mesa-dri >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libegl1 libegl-mesa0 libgl1 libglx-mesa0
          fi
      # PR #51 accidentally merged the diagnostic workflow. Restore the normal gates;
      # keep the diagnostic probe available explicitly, outside the default acceptance run.
      - name: Run real-browser solo, practice and server-room WebSocket flows
        if: steps.scope.outputs.docs-only != 'true'
        run: |
          # Tests tagged @slow (for example nine real browser windows at once) run nightly and on manual runs only.
          SKIP='join repro'
          if [ "${{ github.event_name }}" = pull_request ] || [ "${{ github.event_name }}" = push ]; then SKIP='join repro|@slow'; fi
          if [ "${{ matrix.browser }}" != webkit ]; then
            xvfb-run -a --server-args="-screen 0 1280x1024x24" npx playwright test --grep-invert "$SKIP" --project=${{ matrix.browser }} --headed
          else
            npx playwright test --grep-invert "$SKIP" --project=${{ matrix.browser }}
          fi
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Upload the Playwright report on failure
        if: failure() && steps.scope.outputs.docs-only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/browser/
          retention-days: 7
