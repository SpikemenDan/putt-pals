name: Development task
description: Track substantial work for the two-contributor workflow.
title: "[TASK-ID] Concrete outcome"
body:
  - type: markdown
    attributes:
      value: |
        Follow AGENTS.md. Reuse your contributor branch.
        Small fixes do not require an issue.
        This form does not grant additional permissions.
  - type: input
    id: roadmap-id
    attributes:
      label: Roadmap ID
      description: Optional existing roadmap reference.
  - type: textarea
    id: scope
    attributes:
      label: Outcome and scope
      description: Expected behavior, relevant context and exclusions.
    validations:
      required: true
  - type: textarea
    id: ownership
    attributes:
      label: Contributor and affected paths
      value: |
        Contributor:
        Existing contributor branch:
        Affected paths:
        Overlapping work checked:
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Required issues, interfaces or owner decisions.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and verification
      value: |
        Observable acceptance:
        Relevant checks:
        Browser preview needed:
        Owner feedback needed:
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: Remote authorization, if applicable
      description: Record actual authorization; this field does not grant it.
  - type: textarea
    id: handoff
    attributes:
      label: Progress and handoff
      value: |
        State:
        Commits / PR:
        Changes:
        Commands and results:
        Preview / owner acceptance:
        Blockers / remaining work:
        Next action:
