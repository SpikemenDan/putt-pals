<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>S2 cup behaviour probe</title>
    <style>
      body {
        margin: 0;
        background: #161b2b;
        color: white;
        font: 16px system-ui;
      }
      header {
        padding: 12px;
      }
      canvas {
        display: block;
        width: 100%;
        max-width: 1280px;
      }
      label {
        margin-right: 20px;
      }
      button,
      select,
      input {
        font: inherit;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>S2 · Cup interaction</h1>
      <p>
        Shared simulation and game renderer. Scrub time to inspect entry,
        overshoot, airborne clearance and lip-out.
      </p>
      <label
        >Shot
        <select id="shot">
          <option>slow</option>
          <option>fast</option>
          <option>airborne</option>
          <option>lip</option>
        </select></label
      ><label
        >Time
        <input
          id="time"
          type="range"
          min="0"
          max="2"
          step="0.004166666666666667"
          value="0.2" /></label
      ><output id="status"></output>
    </header>
    <canvas></canvas>
    <script type="module" src="./probe.mjs"></script>
  </body>
</html>
